name: Testy
on:
  push:
  pull_request:
jobs:
  jadro:
    name: Jádro a kalkulačky (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/run.js app/core.js,tools/elektro_test.js -- Priklady
      - run: node tools/run.js app/core.js,app/real.js,tools/real_test.js -- Priklady
      - run: node tools/run.js app/core.js,app/real.js,tools/route_test.js -- Priklady
      - run: node tools/run.js app/core.js,app/real.js,tools/domov3f_test.js
      - run: node tools/run.js app/calc.js,tools/calc_test.js
      - run: node tools/run.js app/core.js,tools/test.js -- Priklady
  ovladani:
    name: Ovládání v prohlížeči (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8766 --directory app &
          sleep 1
          python tools/e2e/ux.py
          python tools/e2e/smoke.py
